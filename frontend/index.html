<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/svg+xml" href="/vite.svg" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Attendance System</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <!-- Apply saved appearance prefs before first paint (prevents theme flash) -->
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("hrms-prefs") || "null") || {};
        var legacy = localStorage.getItem("hrms-theme");
        var theme = p.theme || (legacy === "dark" ? "dark" : "light");
        var accent = p.accent || "teal";
        var r = document.documentElement;
        r.setAttribute("data-theme", theme);
        r.setAttribute("data-accent", accent);
        r.setAttribute("data-font", p.font || "poppins");

        // Custom accent color: derive the full token set before first paint so
        // buttons/links don't flash the preset color.
        var hex = /^#[0-9a-fA-F]{6}$/.test(p.accentColor || "") ? p.accentColor : "#0D9488";
        r.setAttribute("data-accent-color", hex);
        if (accent === "custom") {
          var lum = function (h) {
            var c = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]
              .map(function (v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
            return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
          };
          var mixTo = function (a, b, t) {
            var A = [1, 3, 5].map(function (i) { return parseInt(a.substr(i, 2), 16); });
            var B = [1, 3, 5].map(function (i) { return parseInt(b.substr(i, 2), 16); });
            return "#" + A.map(function (v, i) {
              return Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0");
            }).join("");
          };
          var isDark = theme === "dark";
          var primary = hex;
          if (isDark && lum(primary) < 0.045) primary = mixTo(primary, "#FFFFFF", 0.45);
          var rgb = [1, 3, 5].map(function (i) { return parseInt(primary.substr(i, 2), 16); });
          r.style.setProperty("--primary", primary);
          r.style.setProperty("--primary-light", mixTo(primary, "#FFFFFF", isDark ? 0.3 : 0.18));
          r.style.setProperty("--primary-dark", mixTo(primary, "#000000", 0.2));
          r.style.setProperty("--primary-soft", mixTo(primary, isDark ? "#000000" : "#FFFFFF", isDark ? 0.87 : 0.92));
          r.style.setProperty("--primary-ring", "rgba(" + rgb.join(", ") + ", " + (isDark ? 0.24 : 0.18) + ")");
          r.style.setProperty("--sidebar-accent", isDark ? primary : mixTo(primary, "#FFFFFF", 0.35));
          r.style.setProperty("--sidebar-grad", "linear-gradient(160deg, " + mixTo(primary, "#000000", isDark ? 0.8 : 0.72) + " 0%, " + mixTo(primary, "#000000", isDark ? 0.55 : 0.35) + " 40%, " + primary + " 100%)");
          var L = lum(primary);
          var wc = 1.05 / (L + 0.05);
          r.style.setProperty("--on-primary", wc >= 3 ? "#FFFFFF" : ((L + 0.05) / (lum("#0B1120") + 0.05) > wc ? "#0B1120" : "#FFFFFF"));
        }
        // Preset accents: App.css provides --primary/--on-primary per theme.
      } catch (e) {}
    })();
  </script>

</head>

<body>

  <div id="root"></div>

  <!-- React -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Bootstrap JS (ONLY ONCE) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
